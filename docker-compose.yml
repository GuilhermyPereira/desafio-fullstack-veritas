version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      # Requisito bônus: Persistência em JSON. Isso mantém o arquivo salvo no seu PC!
      - ./backend/tasks.json:/app/tasks.json 

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend